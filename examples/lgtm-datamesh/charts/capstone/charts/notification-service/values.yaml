# notification-service subchart values.

replicas: 1

image:
  # Image is loaded into the node by build-image.sh (minikube image load); no registry.
  repository: capstone/notification-service
  tag: v1
  # Never: images are loaded into the node by build-image.sh (minikube image load) and never pulled; build-image.sh restarts the Deployment so a rebuilt :v1 is used.
  pullPolicy: Never

# NodePort 30083, published on 127.0.0.1:8083 at profile creation
# (map: demos/lib/endpoints.sh). Scaled-to-zero by KEDA (Kafka lag): the
# NodePort has no endpoint until KEDA wakes it.
service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30083

# Postgres connection. The CloudNativePG operator generates a Secret named
# "<cluster>-app" holding the app user's credentials; we reference it by key.
postgres:
  clusterName: capstone-postgres
  appSecret: capstone-postgres-app
  schema: notifications

# Kafka (r25) — consumes order.placed events.
kafka:
  bootstrap: capstone-kafka-kafka-bootstrap:9092
  orderTopic: order-placed
  group: notification-service

# Apicurio schema registry (r25b) — consumer fetches the Avro writer schema by id.
apicurio:
  url: http://apicurio:8080

tracing:
  enabled: true
  otlpEndpoint: http://tempo.observability.svc.cluster.local:4318
  otlpProtocol: http/protobuf
  serviceName: notification-service
  sampleRatio: "1.0"

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

# /health is liveness; /healthz is readiness (checks Postgres).
probes:
  # r28: startupProbe gates liveness/readiness until the app has finished booting.
  # Python services (imports + gRPC channels + schema build) can take 10-30s; a 5s
  # liveness initialDelay was killing them mid-boot (and the gateway OOM-looped at
  # 256Mi). 30 x 2s = 60s startup grace.
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 5
