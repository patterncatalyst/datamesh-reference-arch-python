# Apicurio Registry 3 — schema registry.
# Dev-scale: in-memory storage — the DEFAULT for the 3.x image when no storage
# env is set (data is not persisted across restarts; the producer re-registers
# on startup, so this is harmless for the demo). Production sets a real backend
# (SQL on CloudNativePG, or kafkasql) via APICURIO_STORAGE_KIND + datasource env.

replicas: 1

image:
  repository: quay.io/apicurio/apicurio-registry
  tag: "3.2.4"
  pullPolicy: IfNotPresent

# Exposed as NodePort so it can be reached over the stable SSH tunnel
# (scripts/tunnel-services.sh), same as the other persistent UIs — not a
# kubectl port-forward, which drops when the system quiesces. nodePort 30084 /
# local 8084 is the canonical Apicurio allocation from the lgtm-minikube-stack
# skill (local 8084 avoids the ephemeral demo forwards that transiently use 8080).
service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30084

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi
