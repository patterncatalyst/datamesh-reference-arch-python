# lgtm-serviceaccount.yaml — the grafana/otel-lgtm all-in-one image runs its
# bundled Grafana/Tempo/Loki/Mimir as the image's own (root) user and writes to
# dirs it owns; under OpenShift's default restricted-v2 (random assigned UID)
# Grafana cannot write its data dir and never binds :3000 ("Waiting for Grafana
# to start up..." loop). Bind a dedicated SA to the anyuid SCC so it runs as the
# image's intended UID. (Scoped to this one backend pod — not a blanket grant.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lgtm
  namespace: datamesh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lgtm-anyuid
  namespace: datamesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: lgtm
    namespace: datamesh
