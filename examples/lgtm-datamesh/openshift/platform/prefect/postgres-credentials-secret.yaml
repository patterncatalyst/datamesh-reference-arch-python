# postgres-credentials-secret.yaml — republishes the `prefect` login role's
# DEMO password as a Kubernetes Secret, so server-deployment.yaml can
# `secretKeyRef` it instead of hardcoding a literal in the Deployment env.
#
# The role/database themselves are provisioned by
# ../install-platform.sh's `provision_prefect_db` (SQL against the core
# `postgres-0` pod, same CREATE-ROLE-IF-NOT-EXISTS pattern as
# scripts/setup-openmetadata.sh): role `prefect`, password `prefect`
# (hardcoded demo value in that script), database `prefect`. That script
# does the SQL-side provisioning only — it creates no Kubernetes Secret — so
# this manifest exists purely to carry the same literal value into the
# cluster as a Secret object. If install-platform.sh's PREFECT_PASSWORD ever
# changes, this file's `password` must be updated to match; nothing
# enforces that the two stay in sync.
apiVersion: v1
kind: Secret
metadata:
  name: prefect-postgres-app
  namespace: datamesh
  labels:
    app.kubernetes.io/name: prefect-server
    app.kubernetes.io/part-of: capstone
type: Opaque
stringData:
  username: "prefect"
  password: "prefect"
  dbname: "prefect"
