# airflow-secrets.yaml — placeholder Secret documented by
# examples/lgtm-datamesh/scripts/setup-openmetadata.sh:
#
#   "The chart unconditionally templates an AIRFLOW_PASSWORD env var on every
#   container (init + server) sourced from secretKeyRef -> "airflow-secrets",
#   even when the pipeline service client is disabled. Kubernetes refuses to
#   start a container whose secretKeyRef points at a missing secret, so the
#   run-db-migrations init container fails with CreateContainerConfigError.
#   Since we run no Airflow, the value is never used — but it must EXIST."
#
# Same key as the minikube source (openmetadata-airflow-password); the value
# is never read by anything since pipelineServiceClientConfig.enabled=false
# (om-app-values.yaml) means no Airflow/pipeline client ever starts.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: datamesh
  labels:
    app.kubernetes.io/name: openmetadata
    app.kubernetes.io/part-of: capstone
type: Opaque
stringData:
  openmetadata-airflow-password: "unused"
