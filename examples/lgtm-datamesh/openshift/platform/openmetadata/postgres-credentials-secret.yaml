# postgres-credentials-secret.yaml — republishes the `openmetadata` login
# role's DEMO password as a Kubernetes Secret, so om-app-values.yaml's
# `database.auth.password.secretRef` can read it.
#
# The role/database themselves are provisioned by
# ../install-platform.sh's `provision_openmetadata_db` — confirmed by
# reading that script directly (OPENMETADATA_DB=OPENMETADATA_ROLE=
# "openmetadata", OPENMETADATA_PASSWORD="openmetadata", a hardcoded demo
# value — same name/password pair the minikube source's
# scripts/setup-openmetadata.sh uses for its own CNPG-backed role). That
# script does the SQL-side provisioning only; it creates no Kubernetes
# Secret (unlike the minikube script, which does via `kubectl create secret`),
# so this manifest fills that gap. Key name chosen to match the minikube
# source's own secret shape (`openmetadata-db-app-secret` /
# `openmetadata-db-password`) for familiarity, even though the backing
# mechanism (plain StatefulSet vs CNPG) differs.
#
# If install-platform.sh's OPENMETADATA_PASSWORD ever changes, this file's
# `openmetadata-db-password` value must be updated to match — nothing
# enforces that the two stay in sync.
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-db-app-secret
  namespace: datamesh
  labels:
    app.kubernetes.io/name: openmetadata
    app.kubernetes.io/part-of: capstone
type: Opaque
stringData:
  openmetadata-db-password: "openmetadata"
