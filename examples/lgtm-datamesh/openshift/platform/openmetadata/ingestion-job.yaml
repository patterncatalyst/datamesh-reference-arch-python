# ingestion-job.yaml — one-off Job that ingests the capstone Postgres schemas
# into OpenMetadata, so the catalog has at least one asset. Ported from
# examples/lgtm-datamesh/openmetadata/ingestion/{job-postgres.yaml,postgres.yaml,get_token.py}
# (the minikube source splits the Job, the ConfigMap it mounts, and the
# token-fetch script into three files generated by scripts/ingest-openmetadata.sh;
# this is the same pattern consolidated into one manifest for this authoring
# step).
#
# Target is the `capstone` database (the live app data — orders, inventory,
# notifications, ... schemas), NOT the `openmetadata` database. `openmetadata`
# is OM's own operational store (set in om-app-values.yaml) and is
# deliberately never ingested — the catalog doesn't catalog itself, same as
# the minikube source's postgres.yaml comment explains.
#
# Retargeted from the minikube source:
#   * hostPort:   postgres.datamesh.svc.cluster.local:5432 (plain StatefulSet
#     Service here, not the CNPG capstone-postgres-rw Service).
#   * username:   capstone_app / password: secretKeyRef datamesh-postgres-app
#     (same Secret+keys the app Deployments use —
#     openshift/helm/datamesh/templates/secret-app.yaml), not a dedicated
#     CNPG-generated capstone-postgres-app secret.
#   * sslMode:    disable — this Postgres has no TLS listener configured
#     (unlike CNPG's always-on self-signed cert). VERIFY-POINT: if ingestion
#     can't connect, there is no fallback needed in the other direction since
#     the server genuinely doesn't speak TLS; a `disable` that still fails
#     points at a connectivity/credential problem, not a TLS negotiation one.
#   * OM host:    http://openmetadata:8585 (short name; the Job runs in the
#     same `datamesh` namespace as the OpenMetadata server Service).
#
# Admin login (admin@open-metadata.org / admin) is OpenMetadata's documented
# default-install credential — same VERIFY-POINT the minikube source's
# get_token.py flags: confirm this is still the live default for chart 1.12.8
# at install time, and change OM_ADMIN_PASSWORD if the install customized it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: om-ingestion-config
  namespace: datamesh
  labels:
    app.kubernetes.io/part-of: capstone
    app.kubernetes.io/component: openmetadata-ingestion
data:
  get_token.py: |
    #!/usr/bin/env python3
    """Print an OpenMetadata bearer token to stdout (admin login, in-cluster).
    Ported unchanged from examples/lgtm-datamesh/openmetadata/ingestion/get_token.py."""
    import base64
    import json
    import os
    import sys
    import urllib.request

    HOST = os.environ.get("OM_HOST", "http://openmetadata:8585")
    EMAIL = os.environ.get("OM_ADMIN_EMAIL", "admin@open-metadata.org")
    PASSWORD = os.environ.get("OM_ADMIN_PASSWORD", "admin")

    def main() -> int:
        body = json.dumps(
            {
                "email": EMAIL,
                "password": base64.b64encode(PASSWORD.encode()).decode(),
            }
        ).encode()
        req = urllib.request.Request(
            f"{HOST}/api/v1/users/login",
            data=body,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                token = json.load(resp).get("accessToken")
        except Exception as exc:  # noqa: BLE001
            sys.stderr.write(f"failed to obtain OpenMetadata token from {HOST}: {exc}\n")
            return 1
        if not token:
            sys.stderr.write("login succeeded but no accessToken in the response\n")
            return 1
        sys.stdout.write(token)
        return 0

    if __name__ == "__main__":
        raise SystemExit(main())
  postgres.yaml: |
    source:
      type: postgres
      serviceName: datamesh-postgres
      serviceConnection:
        config:
          type: Postgres
          username: capstone_app
          authType:
            password: __PG_PASSWORD__
          hostPort: postgres.datamesh.svc.cluster.local:5432
          database: capstone
          sslMode: disable
      sourceConfig:
        config:
          type: DatabaseMetadata
          schemaFilterPattern:
            excludes:
              - information_schema
              - pg_catalog
              - pg_toast.*

    sink:
      type: metadata-rest
      config: {}

    workflowConfig:
      openMetadataServerConfig:
        hostPort: http://openmetadata:8585/api
        authProvider: openmetadata
        securityConfig:
          jwtToken: __OM_JWT__
---
apiVersion: batch/v1
kind: Job
metadata:
  name: om-ingest-postgres
  namespace: datamesh
  labels:
    app.kubernetes.io/part-of: capstone
    app.kubernetes.io/component: openmetadata-ingestion
spec:
  backoffLimit: 2
  template:
    metadata:
      annotations:
        # Keep this batch Job out of the mesh the second platform-authoring
        # agent is standing up (OSSM3) — a sidecar would race the ingest
        # container at startup and block the Job from ever completing.
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/part-of: capstone
        app.kubernetes.io/component: openmetadata-ingestion
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          image: docker.io/openmetadata/ingestion:1.12.8
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "==> obtaining OpenMetadata token (admin login, in-cluster)"
              export OM_JWT="$(python3 /opt/ingestion/get_token.py)"
              echo "==> injecting credentials into a writable workflow config"
              python3 - <<'PY'
              import os
              t = open("/opt/ingestion/postgres.yaml").read()
              t = t.replace("__OM_JWT__", os.environ["OM_JWT"])
              t = t.replace("__PG_PASSWORD__", os.environ["PG_PASSWORD"])
              open("/tmp/postgres.yaml", "w").write(t)
              PY
              echo "==> running Postgres ingestion"
              metadata ingest -c /tmp/postgres.yaml
          env:
            - name: OM_HOST
              value: http://openmetadata:8585
            - name: OM_ADMIN_PASSWORD
              value: admin
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datamesh-postgres-app
                  key: password
          volumeMounts:
            - name: ingestion-config
              mountPath: /opt/ingestion
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: ingestion-config
          configMap:
            name: om-ingestion-config
