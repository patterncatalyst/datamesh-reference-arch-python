# routing.yaml — the Istio traffic-management resources for the
# order-service v1/v2 canary, ported/retargeted from
# ../../../istio/routing.yaml (minikube/`capstone`) to OpenShift/`datamesh`.
#
#   Gateway          — exposes order-service through the Sail-managed
#                      ingress gateway, so external traffic entering via
#                      ingress-route.yaml's Route can reach the
#                      VirtualService. Included here (the source file's
#                      three objects travel together) even though the
#                      VirtualService/DestinationRule split is this file's
#                      primary purpose — without a Gateway binding, the
#                      VirtualService below has nothing to attach to for
#                      external traffic.
#   VirtualService   — the canary control: splits HTTP traffic between the
#                      v1 and v2 subsets by weight. Fixed initial 90/10 split
#                      (not the minikube source's __W_V1__/__W_V2__
#                      placeholders — no demo-canary-verify.sh equivalent
#                      exists yet in this tree; adjust the weights in place
#                      to shift the split).
#   DestinationRule  — names the two subsets (v1, v2) by the `version` pod
#                      label app-deployment.yaml (v1, when mesh.enabled) and
#                      order-service-v2.yaml (v2) each set.
#
# VERIFY-POINTS (Istio API; confirm against the installed OSSM3/Sail Istio
# version — istio.yaml's spec.version placeholder — these are not renderable
# offline):
#   * apiVersion networking.istio.io/v1.
#   * The Gateway selector below assumes the Sail-managed ingress gateway
#     carries the conventional `istio: ingressgateway` label; confirm live
#     against whatever Gateway/ingress deployment OSSM3 actually provisions
#     (see ingress-route.yaml's own live-confirm note on the Service name).
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: order-service-gateway
  namespace: datamesh
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: order-service
  namespace: datamesh
spec:
  hosts:
    - "*"
  gateways:
    - order-service-gateway
  http:
    - route:
        - destination:
            host: order-service        # the ClusterIP Service (fronts both subsets)
            subset: v1
          weight: 90
        - destination:
            host: order-service
            subset: v2
          weight: 10
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: order-service
  namespace: datamesh
spec:
  host: order-service
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
