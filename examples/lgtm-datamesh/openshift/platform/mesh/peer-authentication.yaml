# peer-authentication.yaml — namespace-wide mTLS for `datamesh`.
#
# Named `default`: the name Istio requires for a namespace-scoped
# PeerAuthentication to act as that namespace's default policy. Adapted from
# modernizing-enterprise-applications/deploy/k8s/istio/peer-authentication.yaml
# (there scoped to `mea`), itself adapted from
# datamesh-reference-arch-quarkus/k8s/istio/peer-authentication.yaml.
#
# APPLY ORDER: only after a green meshed rollout (install-platform.sh applies
# this after the `helm upgrade --set mesh.enabled=true` step, once all 7 app
# Deployments report Ready with sidecars). Applying STRICT before every pod
# in `datamesh` carries a sidecar would break any still-unmeshed pod's
# inbound traffic — enforced by the receiving Envoy sidecar, not the API
# server, so Postgres/Kafka/Apicurio (no sidecar, not relabeled) are
# unaffected either way and keep accepting their own plaintext as before.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: datamesh
spec:
  mtls:
    mode: STRICT
---
# Workload exception: the graphql-gateway is the public edge, reached by the
# OpenShift router (NOT mesh-aware, sends plaintext). Namespace STRICT (above)
# would 502 that traffic. Scope PERMISSIVE to just the gateway so the external
# Route works, while every service-to-service hop in the mesh stays STRICT.
# (In a production setup you'd instead front it with the Istio ingress gateway
# and terminate mTLS there; on CRC the OpenShift Route is the simpler edge.)
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: graphql-gateway-permissive
  namespace: datamesh
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  mtls:
    mode: PERMISSIVE
