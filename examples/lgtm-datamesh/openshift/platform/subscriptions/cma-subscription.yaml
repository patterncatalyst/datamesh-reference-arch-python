# Custom Metrics Autoscaler (Red Hat's KEDA distribution), own namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-keda
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-keda
  namespace: openshift-keda
spec:
  targetNamespaces: []   # cluster-scoped operand (KedaController) manages openshift-keda
---
# Operator CSVs resolve from the channel at install time and cannot be checked
# without a cluster; the 2026-10-09 platform bump left them as-is. CSVs
# re-checked at the next CRC run.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-custom-metrics-autoscaler-operator
  namespace: openshift-keda
spec:
  channel: stable
  name: openshift-custom-metrics-autoscaler-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
