{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.route }}
---
# OpenShift Route — the platform-native ingress. Replaces the NodePort
# scheme charts/capstone/charts/<svc>/values.yaml's `service.nodePort` uses on
# minikube (NodePorts published to 127.0.0.1 at profile creation); on OpenShift,
# Routes: the cluster's router (the
# `ingress` cluster operator) gives this Service a real external hostname,
# <name>-<namespace>.apps-crc.testing on CRC. Edge TLS terminates at the
# router; plain HTTP is redirected to HTTPS.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "datamesh.labels" $root | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ $name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
