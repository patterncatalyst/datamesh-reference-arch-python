{{- $dns := include "datamesh.dns" . -}}
# Shared Postgres (db `capstone`, one schema per data-product service). Plain
# StatefulSet — NOT the CloudNativePG `Cluster` CR
# charts/capstone/charts/postgres/ uses, since the CNPG operator isn't assumed
# to be installed on the target OpenShift cluster. Preserves the modernization
# appendix's live-apply fixes: `args` (not `command`) so the entrypoint's
# initdb runs; PGDATA in a subdir the postgres user owns; fsGroup 70 for PVC
# writability. Runs under the datamesh-infra ServiceAccount (nonroot-v2 SCC) so
# uid 70 is actually permitted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  labels:
    app.kubernetes.io/name: postgres
    {{- include "datamesh.labels" . | nindent 4 }}
data:
  01-create-schemas.sql: |
    -- Defensive, idempotent: each service's own migration/startup path
    -- (Alembic for notification-service, app-level DDL for the rest) creates
    -- its schema on first run anyway; this makes them present at bring-up.
    CREATE SCHEMA IF NOT EXISTS inventory AUTHORIZATION {{ .Values.postgres.username }};
    CREATE SCHEMA IF NOT EXISTS notifications AUTHORIZATION {{ .Values.postgres.username }};
    CREATE SCHEMA IF NOT EXISTS orders AUTHORIZATION {{ .Values.postgres.username }};
    CREATE SCHEMA IF NOT EXISTS payments AUTHORIZATION {{ .Values.postgres.username }};
    CREATE SCHEMA IF NOT EXISTS reviews AUTHORIZATION {{ .Values.postgres.username }};
    CREATE SCHEMA IF NOT EXISTS shipping AUTHORIZATION {{ .Values.postgres.username }};
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: capstone
    spec:
      serviceAccountName: {{ .Values.infra.serviceAccountName }}
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["postgres"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: datamesh-postgres-app, key: dbname }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: datamesh-postgres-app, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: datamesh-postgres-app, key: password }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"] }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "{{ .Values.postgres.username }}", "-d", "{{ .Values.postgres.database }}"] }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: postgres-initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage | quote }}
