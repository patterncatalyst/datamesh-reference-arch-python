# Dev-only Postgres credential — the Helm port of the CloudNativePG-generated
# "<cluster>-app" Secret that charts/capstone/charts/postgres/ relies on the
# operator to create. This chart runs Postgres as a plain StatefulSet (no
# operator), so it republishes the same shape (username/password/dbname keys)
# as a hand-authored Secret the Deployments' secretKeyRef points at.
# PRODUCTION: replace with a SealedSecret (encrypted at rest in git) or an
# ExternalSecret (synced from a secret manager) — a plaintext Secret manifest
# is never how real creds ship.
apiVersion: v1
kind: Secret
metadata:
  name: datamesh-postgres-app
  labels:
    {{- include "datamesh.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  dbname: {{ .Values.postgres.database | quote }}
