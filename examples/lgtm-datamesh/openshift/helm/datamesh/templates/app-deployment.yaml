{{- $root := . -}}
{{- $dns := include "datamesh.dns" . -}}
{{- range $name, $svc := .Values.services }}
{{- $res := index $root.Values.resources $svc.size }}
---
# {{ $name }} — {{ if $svc.route }}externally exposed via Route; {{ end }}{{ if $svc.db }}owns schema `{{ $svc.db }}`; {{ end }}{{ if $svc.kafka }}talks to Kafka (graceful shutdown); {{ end }}{{ $svc.probe }} health probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "datamesh.labels" $root | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: capstone
        {{- if $root.Values.mesh.enabled }}
        # istio.io/rev LABEL (not an annotation) — the OSSM3/Sail revisioned
        # webhook's injection trigger (DRA-010).
        istio.io/rev: {{ $root.Values.mesh.revision }}
        {{- if eq $name "order-service" }}
        # Matches the DestinationRule `v1` subset (openshift/platform/mesh/routing.yaml).
        version: v1
        {{- end }}
        {{- end }}
    spec:
      {{- if $svc.kafka }}
      # Kafka producer/consumer: allow in-flight records to send/commit before SIGKILL.
      terminationGracePeriodSeconds: 45
      {{- end }}
      {{- if $svc.migrate }}
      # Init container runs Alembic migrations before the app starts, so the
      # schema + tables exist and the app issues no DDL (retires create_all —
      # CAP-021). Same image, same DB env as the app. Ported from
      # charts/capstone/charts/notification-service/templates/deployment.yaml.
      initContainers:
        - name: migrate
          image: "{{ $root.Values.image.registry }}/{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          workingDir: /opt/app-root/src
          command: ["alembic", "upgrade", "head"]
          env:
            - name: SERVICE_SCHEMA
              value: {{ $svc.db | quote }}
            - name: PG_HOST
              value: "postgres.{{ $dns }}"
            - name: PG_PORT
              value: "5432"
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef: { name: datamesh-postgres-app, key: dbname }
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: datamesh-postgres-app, key: username }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: datamesh-postgres-app, key: password }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.registry }}/{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            {{- if $svc.grpcPort }}
            - name: grpc
              containerPort: {{ $svc.grpcPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: datamesh-app-config
          {{- if or $svc.db $svc.grpcPort $root.Values.observability.otlp.enabled }}
          env:
            {{- if $svc.db }}
            - name: SERVICE_SCHEMA
              value: {{ $svc.db | quote }}
            - name: PG_HOST
              value: "postgres.{{ $dns }}"
            - name: PG_PORT
              value: "5432"
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef: { name: datamesh-postgres-app, key: dbname }
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: datamesh-postgres-app, key: username }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: datamesh-postgres-app, key: password }
            {{- end }}
            {{- if $svc.grpcPort }}
            - name: GRPC_PORT
              value: {{ $svc.grpcPort | quote }}
            {{- end }}
            {{- if $root.Values.observability.otlp.enabled }}
            # otel-lgtm OTLP/http (openshift/platform/observability/) — traces
            # only (DRA-011); the opentelemetry-instrument entrypoint these
            # images ship is a no-op until these are set.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $root.Values.observability.otlp.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            {{- end }}
          {{- end }}
          {{- if $svc.kafka }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          {{- end }}
          {{- if eq $svc.probe "http" }}
          startupProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          {{- else }}
          startupProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          resources:
            requests:
              cpu: {{ $res.requests.cpu }}
              memory: {{ $res.requests.memory }}
            limits:
              cpu: {{ $res.limits.cpu }}
              memory: {{ $res.limits.memory }}
          # No runAsUser: OpenShift's restricted-v2 SCC assigns a UID from the
          # namespace range, and the services/<svc>/Containerfile images already
          # run as `USER 1001:0` (arbitrary UID, group 0) — they work fine under
          # whatever UID restricted-v2 assigns. This is the key change from a
          # plain-Kubernetes deploy that could pin a UID.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
{{- end }}
