{{- $root := . -}}
# Apicurio Registry 3 — schema/contract registry (CAP-018). Port of
# charts/capstone/charts/apicurio/, dropping the minikube NodePort/tunnel
# scheme for a ClusterIP Service + Route. No storage env: the apicurio-registry
# 3.x image defaults to the in-memory variant (order-service re-registers the
# order.placed Avro schema on each restart, which is harmless for a demo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
  labels:
    app.kubernetes.io/name: apicurio
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apicurio
        app.kubernetes.io/part-of: capstone
    spec:
      containers:
        - name: apicurio
          image: {{ .Values.apicurio.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.apicurio.port }}
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { memory: 1Gi }
          # startupProbe gives the Quarkus JVM ample time to boot (up to ~150s)
          # before liveness/readiness begin. TCP probe avoids guessing the
          # health path (same as charts/capstone/charts/apicurio/).
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio
  labels:
    app.kubernetes.io/name: apicurio
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apicurio
  ports:
    - name: http
      port: {{ .Values.apicurio.port }}
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: apicurio
  labels:
    app.kubernetes.io/name: apicurio
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: apicurio
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
